services:
  - type: web
    name: money-router
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /opt/render/project/src/data/runtime
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data/runtime
      - key: PAYPAL_ENV
        value: sandbox
      - key: CRAWL_HOUR_UTC
        value: "3"
      - key: CRAWL_DAYS
        value: "1"
      - key: RADAR_DOW
        value: "1"
      - key: LOCALES
        value: en,ja
      - key: DEFAULT_COUNTRY
        value: US
      - key: DEFAULT_LANGUAGE
        value: en
      - key: CRAWLER_MODE
        value: live
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: PAYPAL_SEED_CLIENT_ID
        sync: false
      - key: PAYPAL_SEED_CLIENT_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_RECEIVER_EMAIL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: JUDGE_TOKEN
        sync: false
      - key: DEMO_DAILY_DISCOVERY
        value: "3"
      - key: DEMO_DAILY_BRIEFS
        value: "50"
      - key: DEMO_DAILY_CRAWLS
        value: "1"
      - key: MODEL_EXTRACT
        value: claude-sonnet-5-5
      - key: MODEL_AUDIT
        value: claude-sonnet-5-5
      - key: MODEL_MATCH
        value: claude-opus-5-5
      - key: MODEL_EXPLAIN
        value: claude-opus-5-5
      - key: MODEL_LOCALIZE
        value: claude-sonnet-5-5
      - key: AUDIT_SCHEDULE
        value: mon:claude-fable-5-1:full,thu:claude-opus-5-5:full
